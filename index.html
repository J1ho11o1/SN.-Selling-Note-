
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SN. - Selling Note</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 20px;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
 background:#fff;color:#171717;
}
.container{max-width:520px;margin:auto}
header{
 display:flex;justify-content:space-between;
 align-items:center;padding:15px 0 25px;
 border-bottom:1px solid #eee;
}
.logo{font-size:32px;font-weight:850;letter-spacing:-2px}
.sub{font-size:11px;letter-spacing:4px;color:#999}
button,input,select{font:inherit}
button{
 border:0;border-radius:15px;padding:17px;
 font-weight:700;cursor:pointer;
}
.lang{background:#f3f3f3;padding:10px 15px}
h1{font-size:30px;margin-top:35px}
.muted{color:#888}
.card{
 background:#f5f5f5;border-radius:25px;
 padding:25px;margin:20px 0;
}
.revenue{font-size:38px;font-weight:850;margin:15px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{
 border:1px solid #eee;border-radius:22px;
 padding:20px 15px;
}
.stat strong{display:block;font-size:30px;margin:12px 0}
h3{margin-top:35px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.primary{background:#171717;color:white;width:100%}
.secondary{background:#f3f3f3;color:#171717;width:100%}
.panel{
 border:1px solid #e9e9e9;border-radius:22px;
 padding:22px;margin:15px 0;
}
label{display:block;color:#888;margin:18px 0 8px}
input,select{
 width:100%;padding:17px;
 border:1px solid #ddd;border-radius:14px;
 background:#fafafa;color:#171717;
}
.product{border:1px solid #eee;border-radius:20px;padding:20px;margin:12px 0}
.product strong{font-size:20px}
.small{font-size:13px;color:#888;line-height:2}
.delete{float:right;background:#f3f3f3;padding:8px 12px;color:#888}
.sale{border-bottom:1px solid #eee;padding:15px 0}
.hidden{display:none}
footer{text-align:center;color:#aaa;padding:40px 0}

/* SN Minimal Input Design */
input:focus,
textarea:focus,
select:focus {
    outline: none !important;
    border-color: #bdbdbd !important;
    box-shadow: none !important;
    transition: all 0.25s ease;
}

input,
textarea,
select {
    transition: all 0.25s ease;
}

</style>
</head>
<body>
<div class="container">

<header>
 <div>
  <div class="logo">SN.</div>
  <div class="sub">SELLING NOTE</div>
 </div>
 <button class="lang" onclick="toggleLang()">한국어 / EN</button>
</header>

<h1 id="welcome">안녕하세요!</h1>
<p class="muted" id="intro">나의 판매 관리 대시보드</p>

<div class="card">
 <div class="muted" id="revenueTitle">이번 달 총매출 · Monthly Revenue</div>
 <div class="revenue" id="revenue">₩0</div>
 <div class="muted" id="profit">예상 순이익 ₩0</div>
</div>

<div class="grid">
 <div class="stat">
  <span class="muted" id="productTitle">등록 상품</span>
  <strong id="productCount">0</strong>
  <span class="muted">Total products</span>
 </div>
 <div class="stat">
  <span class="muted" id="orderTitle">판매 건수</span>
  <strong id="orderCount">0</strong>
  <span class="muted">Total orders</span>
 </div>
</div>

<h3 id="quickTitle">빠른 메뉴 · Quick Actions</h3>
<div class="actions">
 <button class="primary" onclick="show('add')">＋ 상품 등록</button>
 <button class="secondary" onclick="show('sell')">＋ 판매 기록</button>
</div>

<section id="add">
 <h3>새 상품 등록 · Add Product</h3>
 <div class="panel">
  <label>상품명 · Product Name</label>
  <input id="pname" placeholder="예: 무지 티셔츠">
  <label>판매 가격 · Selling Price (₩)</label>
  <input id="price" type="number" placeholder="15000">
  <label>매입 가격 · Purchase Price (₩)</label>
  <input id="cost" type="number" placeholder="7000">
  <label>재고 수량 · Stock Quantity</label>
  <input id="stock" type="number" placeholder="20">
  <br><br>
  <button class="primary" onclick="addProduct()">상품 등록하기 · Add Product</button>
 </div>
</section>

<section id="sell">
 <h3>판매 기록 · Record Sale</h3>
 <div class="panel">
  <label>판매 상품 · Select Product</label>
  <select id="sellProduct"></select>
  <label>판매 수량 · Sales Quantity</label>
  <input id="quantity" type="number" min="1" placeholder="판매 수량 입력">
  <label>판매 날짜 · Sale Date</label>
  <input id="saleDate" type="date">
  <br><br>
  <button class="primary" onclick="addSale()">판매 완료 · Complete Sale</button>
 </div>
</section>

<h3>상품 목록 · Products</h3>
<div id="products"></div>

<h3>최근 판매 · Recent Sales</h3>
<div id="sales"></div>

<footer>SN. SELLING NOTE © 2026</footer>
</div>

<script>
let products=JSON.parse(localStorage.getItem('sn_products')||'[]');
let sales=JSON.parse(localStorage.getItem('sn_sales')||'[]');
let english=false;

function save(){
 localStorage.setItem('sn_products',JSON.stringify(products));
 localStorage.setItem('sn_sales',JSON.stringify(sales));
 render();
}

function money(n){
 return '₩'+Number(n).toLocaleString('ko-KR');
}

function show(id){
 document.getElementById(id).scrollIntoView({behavior:'smooth'});
}

function addProduct(){
 let name=document.getElementById('pname').value.trim();
 let price=Number(document.getElementById('price').value);
 let cost=Number(document.getElementById('cost').value);
 let stock=Number(document.getElementById('stock').value);

 if(!name||price<=0||cost<0||stock<0||
 !Number.isInteger(stock)){
  alert('상품 정보를 정확히 입력해 주세요.');
  return;
 }

 products.push({
  id:Date.now(),name,price,cost,stock
 });

 document.getElementById('pname').value='';
 document.getElementById('price').value='';
 document.getElementById('cost').value='';
 document.getElementById('stock').value='';
 save();
 alert('상품이 등록되었습니다.');
}

function addSale(){
 let id=Number(document.getElementById('sellProduct').value);
 let qty=Number(document.getElementById('quantity').value);
 let product=products.find(p=>p.id===id);
 let date=document.getElementById('saleDate').value;

 if(!product||!Number.isInteger(qty)||qty<=0||!date){
  alert('판매 정보를 확인해 주세요.');
  return;
 }

 if(qty>product.stock){
  alert('재고가 부족합니다.');
  return;
 }

 product.stock-=qty;

 sales.unshift({
  id:Date.now(),
  name:product.name,
  qty,
  price:product.price,
  cost:product.cost,
  date
 });

 document.getElementById('quantity').value='';
 save();
 alert('판매 기록이 저장되었습니다.');
}

function deleteProduct(id){
 if(!confirm('상품을 삭제할까요?'))return;
 products=products.filter(p=>p.id!==id);
 save();
}

function render(){
 let now=new Date();
 let month=now.toISOString().slice(0,7);
 let monthly=sales.filter(s=>s.date.startsWith(month));
 let revenue=monthly.reduce((a,s)=>a+s.price*s.qty,0);
 let profit=monthly.reduce((a,s)=>a+(s.price-s.cost)*s.qty,0);

 document.getElementById('revenue').textContent=money(revenue);
 document.getElementById('profit').textContent=
 '예상 순이익 '+money(profit);
 document.getElementById('productCount').textContent=products.length;
 document.getElementById('orderCount').textContent=
 monthly.reduce((a,s)=>a+s.qty,0);

 document.getElementById('products').innerHTML=
 products.map(p=>`
 <div class="product">
  <button class="delete" onclick="deleteProduct(${p.id})">삭제</button>
  <strong>${escapeHTML(p.name)}</strong>
  <div class="small">
   판매 가격 · ${money(p.price)}<br>
   매입 가격 · ${money(p.cost)}<br>
   예상 개당 차익 · ${money(p.price-p.cost)}<br>
   재고 · ${p.stock}개
  </div>
 </div>`).join('')||'<p class="muted">등록된 상품이 없습니다.</p>';

 document.getElementById('sellProduct').innerHTML=
 products.map(p=>`
 <option value="${p.id}">${escapeHTML(p.name)} (재고 ${p.stock})</option>
 `).join('')||'<option value="">등록된 상품 없음</option>';

 document.getElementById('sales').innerHTML=
 sales.slice(0,20).map(s=>`
 <div class="sale">
  <strong>${escapeHTML(s.name)}</strong>
  <div class="small">
   ${s.date} · ${s.qty}개 · ${money(s.price*s.qty)}
  </div>
 </div>`).join('')||'<p class="muted">아직 판매 기록이 없습니다.</p>';
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 })[c]);
}

function toggleLang(){
 english=!english;
 document.getElementById('welcome').textContent=
 english?'Welcome!':'안녕하세요!';
 document.getElementById('intro').textContent=
 english?'Your selling dashboard':'나의 판매 관리 대시보드';
 document.getElementById('revenueTitle').textContent=
 english?'Monthly Revenue':'이번 달 총매출 · Monthly Revenue';
 document.getElementById('productTitle').textContent=
 english?'Products':'등록 상품';
 document.getElementById('orderTitle').textContent=
 english?'Sales Quantity':'판매 건수';
 document.getElementById('quickTitle').textContent=
 english?'Quick Actions':'빠른 메뉴 · Quick Actions';
}

document.getElementById('saleDate').value=
new Date().toLocaleDateString('en-CA');

render();
</script>
</body>
</html>
